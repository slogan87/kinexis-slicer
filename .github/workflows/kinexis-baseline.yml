name: Kinexis Windows baseline

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline CMake
        run: python -m pip install cmake==3.31.6
      - name: Record revision and tools
        shell: pwsh
        run: |
          git rev-parse HEAD
          cmake --version
      - name: Build dependencies, desktop app, and run tests
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Jobs 2
      - name: Preserve test results and configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-diagnostics
          if-no-files-found: ignore
          path: |
            build/kinexis-baseline/test-results.xml
            build/kinexis-baseline/Testing/Temporary/LastTest.log
            build/kinexis-baseline/CMakeFiles/CMakeConfigureLog.yaml
            deps/build-kinexis/CMakeFiles/CMakeConfigureLog.yaml
