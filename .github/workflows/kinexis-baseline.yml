name: Kinexis Windows baseline

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinexis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline CMake
        run: python -m pip install cmake==3.31.6
      - name: Record revision and tools
        id: compiler
        shell: pwsh
        run: |
          git rev-parse HEAD
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio 2022 C++ tools were not found.' }
          $compilerVersion = (Get-Content "$vsRoot/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt").Trim()
          "version=$compilerVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Restore dependency bundle
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build-kinexis/destdir/usr/local
          key: windows-vs2022-${{ steps.compiler.outputs.version }}-cmake3.31.6-stl-${{ hashFiles('deps/**', 'cmake/modules/**', 'scripts/kinexis-build.ps1') }}
      - name: Configure dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Stage ConfigureDeps -Jobs 2
      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Stage Deps -Jobs 2
      - name: Save completed dependency bundle
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build-kinexis/destdir/usr/local
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Configure desktop app and tests
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Stage Configure -Jobs 2
      - name: Build desktop app and tests
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Stage Build -Jobs 2
      - name: Run slicer tests
        shell: pwsh
        run: ./scripts/kinexis-build.ps1 -Stage Test -Jobs 2
      - name: Preserve test results and configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-diagnostics
          if-no-files-found: ignore
          path: |
            build/kinexis-baseline/test-results.xml
            build/kinexis-baseline/Testing/Temporary/LastTest.log
            build/kinexis-baseline/CMakeFiles/CMakeConfigureLog.yaml
            deps/build-kinexis/CMakeFiles/CMakeConfigureLog.yaml
